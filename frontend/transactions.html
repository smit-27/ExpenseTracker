<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transactions - Expense Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="logo">Expense Tracker</div>

        <nav>
            <button class="nav-item"
                    onclick="window.location.href='dashboard.html'">
                Dashboard
            </button>

            <button class="nav-item active">
                Transactions
            </button>

            <button class="nav-item"
                    onclick="window.location.href='categories.html'">
                Categories
            </button>

            <button class="nav-item"
                    onclick="window.location.href='budgets.html'">
                Budgets
            </button>
        </nav>

        <button class="logout-button" id="logout-button">
            Logout
        </button>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Transactions</h1>
                <p>Manage your income and expenses</p>
            </div>

        </header>


        <div id="transaction-message"></div>


        <!-- Add transaction -->

        <section class="dashboard-card form-card">

            <h2>Add Transaction</h2>

            <form id="transaction-form">

                <div class="form-row">

                    <div class="form-group">

                        <label for="transaction-category">
                            Category
                        </label>

                        <select
                                id="transaction-category"
                                required>
                        </select>

                    </div>


                    <div class="form-group">

                        <label for="transaction-amount">
                            Amount
                        </label>

                        <input
                                type="number"
                                id="transaction-amount"
                                step="0.01"
                                min="0.01"
                                placeholder="Amount"
                                required>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="transaction-date">
                            Date
                        </label>

                        <input
                                type="date"
                                id="transaction-date"
                                required>

                    </div>


                    <div class="form-group">

                        <label for="transaction-description">
                            Description
                        </label>

                        <input
                                type="text"
                                id="transaction-description"
                                maxlength="255"
                                placeholder="Description">

                    </div>

                </div>


                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </section>


        <!-- Transactions -->

        <section class="dashboard-card table-card">

            <div class="card-header">
                <h2>All Transactions</h2>
            </div>

            <div class="table-container">

                <table>

                    <thead>

                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>

                    </thead>

                    <tbody id="transactions-table-body">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<script src="js/api.js"></script>
<script src="js/transactions.js"></script>

</body>

</html>
