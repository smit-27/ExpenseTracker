<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Budgets - Expense Tracker</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            Expense Tracker
        </div>

        <nav>

            <button
                    class="nav-item"
                    onclick="window.location.href='dashboard.html'">
                Dashboard
            </button>

            <button
                    class="nav-item"
                    onclick="window.location.href='transactions.html'">
                Transactions
            </button>

            <button
                    class="nav-item"
                    onclick="window.location.href='categories.html'">
                Categories
            </button>

            <button class="nav-item active">
                Budgets
            </button>

        </nav>

        <button
                class="logout-button"
                id="logout-button">
            Logout
        </button>

    </aside>


    <!-- Main content -->

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>Budgets</h1>

                <p>
                    Plan and monitor your monthly spending
                </p>

            </div>

        </header>


        <div id="budget-message"></div>


        <!-- Add Budget -->

        <section class="dashboard-card form-card">

            <h2>Add Budget</h2>

            <form id="budget-form">

                <div class="form-row">

                    <div class="form-group">

                        <label for="budget-category">
                            Category
                        </label>

                        <select
                                id="budget-category"
                                required>

                            <option value="">
                                Select expense category
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="budget-amount">
                            Budget Amount
                        </label>

                        <input
                                type="number"
                                id="budget-amount"
                                min="0.01"
                                step="0.01"
                                placeholder="e.g. 5000"
                                required>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="budget-month">
                            Budget Month
                        </label>

                        <input
                                type="month"
                                id="budget-month"
                                required>

                    </div>

                    <div></div>

                </div>


                <button type="submit">
                    Add Budget
                </button>

            </form>

        </section>


        <!-- Budget report -->

        <section class="dashboard-card">

            <div class="card-header">

                <h2>Budget Overview</h2>

            </div>


            <div id="budget-report">

                <p class="empty-message">
                    Loading budgets...
                </p>

            </div>

        </section>

    </main>

</div>


<script src="js/api.js"></script>
<script src="js/budgets.js"></script>

</body>

</html>
